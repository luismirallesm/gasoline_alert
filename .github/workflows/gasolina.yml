name: gasolina
on:
  schedule:
    - cron: "30 6 * * *"    # 1.er intento (~08:30 España)
    - cron: "30 8 * * *"    # 2.º intento, solo actúa si el 1.º no pudo
    - cron: "30 10 * * *"   # 3.er y último intento: si falla, avisa solo con el mercado
  workflow_dispatch:         # lanzarlo a mano para probar
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python gasolina_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PETICION: ${{ github.event_name == 'workflow_dispatch' }}
          ULTIMO_INTENTO: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 10 * * *' }}
      - name: Guardar histórico
        if: always()
        run: |
          git config user.name "gasolina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "datos $(date -u +%F)" && git push)
