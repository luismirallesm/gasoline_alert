name: gasolina
on:
  schedule:
    - cron: "30 6 * * *"    # intento principal (~07:30-08:30 España): una sola consulta al Ministerio
    - cron: "30 10 * * *"   # reserva: solo actúa si el principal no pudo; si falla, avisa solo con el mercado
  workflow_dispatch:         # lanzarlo a mano para probar
concurrency:                 # GitHub a veces retrasa horas los cron: que nunca corran dos a la vez
  group: gasolina
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python gasolina_bot.py
        env:
          PETICION: ${{ github.event_name == 'workflow_dispatch' }}
          ULTIMO_INTENTO: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 10 * * *' }}
      - name: Guardar histórico
        if: always()
        run: |
          git config user.name "gasolina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git diff --cached --quiet || (git commit -m "datos $(date -u +%F)" && git push)
