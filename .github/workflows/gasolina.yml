name: gasolina
on:
  schedule:
    - cron: "30 6 * * *"   # cada día ~08:30 hora de España
  workflow_dispatch:        # permite lanzarlo a mano para probar
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python gasolina_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar histórico
        if: always()
        run: |
          git config user.name "gasolina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "datos $(date -u +%F)" && git push)
