name: analisis
on:
  workflow_dispatch:         # solo se lanza a mano
permissions:
  contents: write
jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python analisis_retrasos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar informe y modelo
        if: always()
        run: |
          git config user.name "gasolina-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "analisis $(date -u +%F)" && git pull --rebase --autostash && git push)
